<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Happy Birthday, Neha Vaini!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700;1,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --rose: #d1235c;
      --head: #b82555;
      --ink: #4a2a36;
      --soft: #8a5568;
      --gold: #d4af37;
      --u: 1vh;
    }
    @supports (height: 1dvh) {
      :root {
        --u: 1dvh;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% 38%, #fff8f9 0%, #fbe9ee 55%, #f8d7df 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    button,
    input,
    textarea {
      font-family: inherit;
      touch-action: manipulation;
    }

    #root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* Ambient Pastel Orbs */
    #orbs {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    #orbs i {
      position: absolute;
      border-radius: 50%;
      filter: blur(56px);
      opacity: 0.55;
      animation: drift 14s ease-in-out infinite alternate;
    }
    #orbs i:nth-child(1) {
      width: 280px;
      height: 280px;
      background: #ffc2d4;
      top: -60px;
      left: -70px;
    }
    #orbs i:nth-child(2) {
      width: 300px;
      height: 300px;
      background: #ffe3c9;
      bottom: -90px;
      right: -80px;
      animation-delay: -5s;
    }
    #orbs i:nth-child(3) {
      width: 220px;
      height: 220px;
      background: #e6d6ff;
      top: 42%;
      left: 55%;
      animation-delay: -9s;
    }
    @keyframes drift {
      to {
        transform: translate(30px, -26px) scale(1.12);
      }
    }

    /* Rising Ambient Sparkles & Stars */
    #hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .fh {
      position: absolute;
      bottom: -40px;
      opacity: 0.55;
      animation: rise linear forwards;
    }
    @keyframes rise {
      to {
        transform: translate(var(--dx), -115vh) rotate(var(--r));
        opacity: 0;
      }
    }

    /* Twilight Backdrop (Stage 3 Candle Wish) */
    #dim {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(84, 28, 60, 0.72), rgba(24, 8, 34, 0.92));
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
      z-index: 2;
    }
    #dim.on {
      opacity: 1;
    }

    /* Responsive Stage Layout */
    #stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      overflow-y: auto;
      overflow-x: hidden;
      padding: calc(54px + env(safe-area-inset-top)) 16px calc(58px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }
    #stage > .in {
      margin: auto;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      text-align: center;
      animation: enter 0.72s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    #stage.leave > .in {
      animation: leave 0.3s ease both;
    }
    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes leave {
      to {
        opacity: 0;
        transform: translateY(-14px) scale(0.98);
      }
    }
    @keyframes fin {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Typography */
    h1,
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 700;
      color: var(--head);
      line-height: 1.16;
      transition: color 0.9s;
    }
    h1 {
      font-size: clamp(26px, 7.5vw, 40px);
    }
    h1 .nm {
      display: block;
      margin-top: 2px;
      font-size: clamp(36px, 11.5vw, 60px);
      font-weight: 800;
      overflow-wrap: anywhere;
      background: linear-gradient(135deg, #c81e55, #f0658f 60%, #d1235c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 0 4px 6px;
    }
    h2 {
      font-size: clamp(24px, 6.8vw, 34px);
    }
    .sub {
      font-size: 14px;
      line-height: 1.45;
      color: var(--soft);
      font-weight: 600;
      transition: color 0.9s, opacity 0.6s;
      padding: 0 6px;
    }
    .q {
      font-size: clamp(16px, 4.5vw, 19px);
      font-weight: 600;
      color: #5c3a47;
      line-height: 1.4;
    }
    .hand {
      font-family: 'Caveat', cursive;
    }
    .pill {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid #f0cdd8;
      color: #9e6b7a;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
    }

    /* Tactile Buttons */
    .btn {
      position: relative;
      overflow: hidden;
      font: 700 15px 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #de2b65, #c81e55);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 13px 32px;
      min-height: 46px;
      cursor: pointer;
      box-shadow: 0 10px 24px -6px rgba(209, 35, 92, 0.5);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s, opacity 0.6s;
    }
    .btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 36%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      animation: shine 3.4s infinite;
    }
    @keyframes shine {
      0%,
      60% {
        left: -60%;
      }
      100% {
        left: 130%;
      }
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn.ghost {
      background: #fff;
      color: var(--rose);
      border: 2px solid #f0b4c6;
      box-shadow: 0 6px 16px -8px rgba(209, 35, 92, 0.35);
    }
    .btn.ghost::after {
      display: none;
    }
    .btn.sm {
      padding: 11px 20px;
      min-height: 42px;
      font-size: 14px;
    }
    .slot {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reveal {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.6s, transform 0.6s;
    }
    .reveal.on {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    /* Stage 1: Welcome (Crown & Celebration Arch) */
    .bunting {
      width: min(350px, 90vw);
      height: auto;
      display: block;
    }
    .scene {
      width: min(260px, 68vw, calc(var(--u) * 26));
      height: auto;
      display: block;
      overflow: visible;
    }
    .rowbox {
      position: relative;
      width: 100%;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #no {
      transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
      white-space: nowrap;
    }
    .tw {
      animation: tw 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes tw {
      50% {
        opacity: 0.35;
        transform: scale(0.7);
      }
    }

    /* Stage 2: Balloons */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 12px 24px;
      justify-content: center;
    }
    .bal {
      --bh: min(148px, calc(var(--u) * 20));
      width: calc(var(--bh) * 0.8);
      height: var(--bh);
      position: relative;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .bal svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: bob 3.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 10px rgba(120, 40, 70, 0.18));
    }
    .bal:nth-child(2) svg {
      animation-delay: -0.8s;
    }
    .bal:nth-child(3) svg {
      animation-delay: -1.6s;
    }
    .bal:nth-child(4) svg {
      animation-delay: -2.4s;
    }
    @keyframes bob {
      50% {
        transform: translateY(-9px) rotate(2deg);
      }
    }
    .bal .word {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      color: var(--head);
      line-height: 1;
      text-align: center;
      overflow-wrap: anywhere;
      padding: 0 4px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.5s 0.12s, transform 0.6s 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bal.popped svg {
      animation: pop 0.3s forwards;
    }
    .bal.popped .word {
      opacity: 1;
      transform: scale(1);
    }
    @keyframes pop {
      40% {
        transform: scale(1.18);
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
        visibility: hidden;
      }
    }
    .spark {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      pointer-events: none;
      animation: spk 0.7s forwards;
    }
    @keyframes spk {
      to {
        transform: translate(var(--x), var(--y)) scale(0);
        opacity: 0;
      }
    }

    /* Stage 3: Candle */
    .cake {
      width: min(265px, 74vw, calc(var(--u) * 36));
      height: auto;
      display: block;
      cursor: pointer;
      transition: filter 1.4s;
      overflow: visible;
    }
    #stage.twilight .cake {
      filter: brightness(0.78) saturate(0.9);
    }
    .hdslot {
      display: grid;
      width: 100%;
      min-height: 74px;
      font-size: clamp(24px, 6.8vw, 34px);
    }
    .hdslot > * {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.85s ease;
    }
    .wishtxt {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(32px, 9.5vw, 46px);
      line-height: 1.08;
      color: #fff3cc;
      text-shadow: 0 2px 14px rgba(255, 198, 107, 0.95), 0 0 34px rgba(255, 158, 184, 0.85);
      opacity: 0;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    #stage.twilight .wishtxt {
      opacity: 1;
    }
    #stage.twilight .hdslot h2 {
      opacity: 0;
    }
    #stage.twilight .sub.hint {
      opacity: 0;
    }
    .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flick 0.22s ease-in-out infinite alternate;
    }
    @keyframes flick {
      from {
        transform: scale(1, 1) rotate(-3deg);
      }
      to {
        transform: scale(0.9, 1.12) rotate(3deg);
      }
    }
    .halo {
      animation: halo 1.6s ease-in-out infinite alternate;
    }
    @keyframes halo {
      from {
        opacity: 0.5;
      }
      to {
        opacity: 0.85;
      }
    }
    .smoke {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .out .flame,
    .out .halo {
      display: none;
    }
    .out .smoke {
      animation: smk 2.8s ease-out forwards;
    }
    .out .smoke:nth-of-type(2) {
      animation-delay: 0.35s;
    }
    .out .smoke:nth-of-type(3) {
      animation-delay: 0.7s;
    }
    @keyframes smk {
      0% {
        opacity: 0.75;
        transform: translateY(0) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(2);
      }
    }

    /* Stage 4: Royal Crown Constellation (Full Connected Crown!) */
    .sky {
      width: min(315px, 86vw, calc(var(--u) * 39 * 1.15));
      aspect-ratio: 300 / 260;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 40px -14px rgba(40, 20, 80, 0.6);
    }
    .sky svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sky .st {
      cursor: pointer;
    }
    .sky .st .core {
      transform-box: fill-box;
      transform-origin: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sky .st .glow {
      opacity: 0;
      transition: opacity 0.6s;
    }
    .sky .st.lit .glow {
      opacity: 1;
    }
    .sky .st:not(.lit) .core {
      fill: #8582bd;
      transform: scale(0.75);
      animation: tw 2.6s ease-in-out infinite;
    }
    .sky .st.lit .core {
      fill: #ffe08a;
      transform: scale(1.38);
    }
    .sky .line {
      stroke: #ffd9a0;
      stroke-width: 2.2;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .sky.done .line {
      animation: draw 2.2s ease forwards;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    .sky .hfill {
      fill: #ffd27a;
      opacity: 0;
      transition: opacity 2s 1.4s;
    }
    .sky.done .hfill {
      opacity: 0.25;
    }
    .swap {
      display: grid;
      width: 100%;
      min-height: 42px;
    }
    .swap > * {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s;
    }
    .swap .b {
      opacity: 0;
    }
    .swap.on .a {
      opacity: 0;
    }
    .swap.on .b {
      opacity: 1;
    }

    /* Stage 5: Interactive Spin-the-Wheel (Vaini's Birthday Fortune!) */
    .wheel-wrap {
      position: relative;
      width: min(260px, 74vw);
      height: min(260px, 74vw);
      display: grid;
      place-items: center;
      margin: 4px 0;
    }
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--rose);
      filter: drop-shadow(0 3px 6px rgba(184, 37, 85, 0.45));
    }
    .wheel-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 16px 36px -12px rgba(184, 37, 85, 0.48), 0 0 0 5px #fff, 0 0 0 8px var(--gold);
      transition: transform 3.6s cubic-bezier(0.15, 0.85, 0.25, 1);
      cursor: pointer;
    }
    .wheel-res {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #f2b7c6;
      border-radius: 16px;
      padding: 12px 16px;
      width: 100%;
      animation: enter 0.5s both;
      box-shadow: 0 10px 24px -12px rgba(184, 37, 85, 0.35);
    }

    /* Stage 6: Polaroid Moments */
    .stackbox {
      --h: min(295px, calc(var(--u) * 38));
      position: relative;
      height: var(--h);
      width: min(calc(var(--h) * 0.8), 72vw);
      touch-action: none;
      cursor: grab;
      margin: 6px 0;
    }
    .pol {
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 6px;
      padding: 10px 10px 0;
      box-shadow: 0 14px 30px -10px rgba(120, 40, 70, 0.45);
      transition: transform 0.45s cubic-bezier(0.3, 0.8, 0.3, 1), opacity 0.4s;
      will-change: transform;
    }
    .pol .ph {
      height: calc(100% - 54px);
      border-radius: 3px;
      overflow: hidden;
      background: #fbe3ea;
    }
    .pol img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .pol .cap {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 24px;
      color: var(--head);
      padding: 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stage 7: Why You're the Best Vaini */
    .list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .item {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid #f3c8d5;
      color: var(--ink);
      cursor: pointer;
      font: 600 14px/1.4 'Plus Jakarta Sans', sans-serif;
      box-shadow: 0 10px 24px -14px rgba(184, 37, 85, 0.5);
      transition: transform 0.25s, background 0.4s, border-color 0.4s;
    }
    .item:active {
      transform: scale(0.98);
    }
    .item .ic {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffd1de, #f7a1bc);
      font-size: 16px;
    }
    .item .tx {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .item .on {
      display: none;
    }
    .item.open {
      background: #fff;
      border-color: #e59ab3;
      cursor: default;
    }
    .item.open .off {
      display: none;
    }
    .item.open .on {
      display: block;
      animation: fin 0.6s both;
    }

    /* Stage 8: 3D Flip Vaini VIP Vouchers */
    .promise-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      perspective: 1100px;
    }
    .pcard {
      position: relative;
      width: 100%;
      min-height: 76px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .pcard.flipped {
      transform: rotateX(180deg);
      cursor: default;
    }
    .pface {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      box-shadow: 0 12px 26px -14px rgba(184, 37, 85, 0.52);
    }
    .pfront {
      background: linear-gradient(135deg, #fff8fa 0%, #fde6ee 100%);
      border: 1.5px solid #e9b465;
    }
    .pback {
      transform: rotateX(180deg);
      background: linear-gradient(135deg, #ffffff 0%, #fff4f7 100%);
      border: 1.5px solid #e291ac;
    }
    .wax {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f05a8c, #b4194c);
      border: 2px solid #f3cf7a;
      color: #fff;
      font-size: 16px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 10px rgba(180, 25, 76, 0.35);
    }
    .pback .wax {
      background: linear-gradient(135deg, #ffe7a8, #f2be5c);
      color: #8f3250;
      border-color: #fff;
    }
    .ptx {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.38;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .pfront .ptx {
      color: var(--head);
    }

    /* Stage 9: Royal Scroll / Newspaper "VAINI TIMES" (Completely different from Envelope!) */
    .scroll-box {
      width: 100%;
      max-width: 365px;
      background: #fffdf8;
      border: 2px solid #e4c686;
      border-radius: 16px;
      box-shadow: 0 18px 40px -14px rgba(120, 40, 70, 0.45);
      overflow: hidden;
      text-align: left;
      animation: enter 0.75s both;
    }
    .news-hdr {
      background: linear-gradient(135deg, #fbe5ec, #f8d4e0);
      border-bottom: 2px double #d4af37;
      padding: 12px 14px 10px;
      text-align: center;
    }
    .news-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;

          return i % 2 ? 2 + (i % 3) : -(2 + (i % 3));
        }
        function lay() {
          Array.prototype.forEach.call(cards, function (el, i) {
            var pos = (i - c + n) % n;
            el.style.zIndex = n - pos;
            el.style.opacity = pos > 3 ? 0 : 1;
            el.style.transform = 'translateY(' + pos * 7 + 'px) rotate(' + (pos === 0 ? 0 : rot(i)) + 'deg) scale(' + (1 - pos * 0.045) + ')';
          });
          $('#pc', box).textContent = c + 1 + ' / ' + n;
        }
        function fly(dir) {
          S.swipe();
          var el = cards[c];
          el.style.transition = 'transform .4s ease,opacity .35s';
          el.style.transform = 'translate(' + dir * 360 + 'px,-30px) rotate(' + dir * 24 + 'deg)';
          el.style.opacity = 0;
          T(function () {
            el.style.transition = 'none';
            c = (c + 1) % n;
            if (!seen[c]) {
              seen[c] = 1;
              cnt++;
            }
            lay();
            void el.offsetWidth;
            el.style.transition = '';
            if (cnt >= Math.min(n, 4)) nx.classList.add('on');
          }, 360);
        }

        lay();
        if (n === 1) nx.classList.add('on');

        var sx = null,
          sy = 0,
          dx = 0,
          drag = false;
        pw.addEventListener('pointerdown', function (e) {
          if (n < 2) return;
          sx = e.clientX;
          sy = e.clientY;
          dx = 0;
          drag = true;

            pw.setPointerCapture(e.pointerId);

          cards[c].style.transition = 'none';
        });
        pw.addEventListener('pointermove', function (e) {
          if (!drag) return;
          dx = e.clientX - sx;
          cards[c].style.transform = 'translate(' + dx + 'px,' + (e.clientY - sy) * 0.2 + 'px) rotate(' + dx * 0.06 + 'deg)';
        });
        function end() {
          if (!drag) return;
          drag = false;
          cards[c].style.transition = '';
          if (Math.abs(dx) > 50) fly(dx < 0 ? -1 : 1);
          else if (Math.abs(dx) < 10) fly(1);
          else lay();
        }
        pw.addEventListener('pointerup', end);
        pw.addEventListener('pointercancel', function () {
          if (drag) {
            drag = false;
            cards[c].style.transition = '';
            lay();
          }
        });
        nx.onclick = next;
      }

      /* ---------- CONFETTI ---------- */
      function confetti() {
        var cv = $('#conf'),
          x = cv.getContext('2d'),
          dpr = window.devicePixelRatio || 1,
          W = cv.clientWidth,
          H = cv.clientHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        x.setTransform(dpr, 0, 0, dpr, 0, 0);
        var cols = ['#f06292', '#ffd27a', '#9ed9e8', '#c3a6f0', '#a8e3c1', '#d1235c', '#fff', '#ffb199'],
          ps = [];
        function burst(ox, oy, n, sp) {
          for (var i = 0; i < n; i++) {
            var a = Math.random() * Math.PI * 2,
              s = (0.35 + Math.random() * 0.65) * sp;
            ps.push({
              x: ox,
              y: oy,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s - 6,
              c: cols[i % cols.length],
              w: 6 + Math.random() * 7,
              h: 4 + Math.random() * 6,
              r: Math.random() * 6,
              vr: Math.random() * 0.4 - 0.2,
              star: Math.random() < 0.25
            });
          }
        }
        burst(W / 2, H * 0.5, 150, 14);
        setTimeout(function () {
          burst(W * 0.15, H * 0.9, 50, 15);
          burst(W * 0.85, H * 0.9, 50, 15);
        }, 350);

        var f = 0;
        (function d() {
          x.clearRect(0, 0, W, H);
          ps.forEach(function (p) {
            p.vy += 0.26;
            p.vx *= 0.992;
            p.vy *= 0.995;
            p.x += p.vx;
            p.y += p.vy;
            p.r += p.vr;
            x.save();
            x.translate(p.x, p.y);
            x.rotate(p.r);
            x.fillStyle = p.c;
            if (p.star) {
              x.font = '16px serif';
              x.fillText('✦', -6, 6);
            } else {
              x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            }
            x.restore();
          });
          if (++f < 300) requestAnimationFrame(d);
          else x.clearRect(0, 0, W, H);
        })();
      }

      function exportHtml(cfg) {
        var el = document.documentElement.cloneNode(true);
        var r = el.querySelector('#root');
        r.innerHTML = '';
        r.removeAttribute('style');
        [].forEach.call(el.querySelectorAll('html,body'), function (e) {
          e.removeAttribute('style');
        });
        el.removeAttribute('style');
        var safeJson = JSON.stringify(cfg)
          .replace(/</g, '\\u003c')
          .replace(/>/g, '\\u003e')
          .replace(/&/g, '\\u0026')
          .replace(/\u2028/g, '\\u2028')

        el.querySelector('#cfg').textContent = 'window.BAKED=' + safeJson + ';';

        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 800);
        var m = $('#a_msg');
        if (m) m.textContent = 'Downloaded index.html with all your edits and photos baked in.';
