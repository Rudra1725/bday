<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>Happy Birthday, Neha Vaini! 🎂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&amp;family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700;1,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --rose: #d1235c;
      --head: #b82555;
      --ink: #4a2a36;
      --soft: #8a5568;
      --gold: #d4af37;
      --u: 1vh;
    }
    @supports (height: 1dvh) {
      :root {
        --u: 1dvh;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    html,
    body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--ink);
      background: radial-gradient(circle at 50% 38%, #fff8f9 0%, #fbe9ee 55%, #f8d7df 100%);
      user-select: none;
      -webkit-user-select: none;
    }
    button,
    input,
    textarea {
      font-family: inherit;
      touch-action: manipulation;
    }

    #root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* Ambient Pastel Orbs */
    #orbs {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    #orbs i {
      position: absolute;
      border-radius: 50%;
      filter: blur(56px);
      opacity: 0.55;
      animation: drift 14s ease-in-out infinite alternate;
    }
    #orbs i:nth-child(1) {
      width: 280px;
      height: 280px;
      background: #ffc2d4;
      top: -60px;
      left: -70px;
    }
    #orbs i:nth-child(2) {
      width: 300px;
      height: 300px;
      background: #ffe3c9;
      bottom: -90px;
      right: -80px;
      animation-delay: -5s;
    }
    #orbs i:nth-child(3) {
      width: 220px;
      height: 220px;
      background: #e6d6ff;
      top: 42%;
      left: 55%;
      animation-delay: -9s;
    }
    @keyframes drift {
      to {
        transform: translate(30px, -26px) scale(1.12);
      }
    }

    /* Rising Ambient Sparkles & Stars */
    #hearts {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }
    .fh {
      position: absolute;
      bottom: -40px;
      opacity: 0.55;
      animation: rise linear forwards;
    }
    @keyframes rise {
      to {
        transform: translate(var(--dx), -115vh) rotate(var(--r));
        opacity: 0;
      }
    }

    /* Twilight Backdrop (Stage 3 Candle Wish) */
    #dim {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(84, 28, 60, 0.72), rgba(24, 8, 34, 0.92));
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s ease;
      z-index: 2;
    }
    #dim.on {
      opacity: 1;
    }

    /* Responsive Stage Layout */
    #stage {
      position: absolute;
      inset: 0;
      z-index: 3;
      display: flex;
      overflow-y: auto;
      overflow-x: hidden;
      padding: calc(54px + env(safe-area-inset-top)) 16px calc(58px + env(safe-area-inset-bottom));
      -webkit-overflow-scrolling: touch;
    }
    #stage > .in {
      margin: auto;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      text-align: center;
      animation: enter 0.72s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    #stage.leave > .in {
      animation: leave 0.3s ease both;
    }
    @keyframes enter {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
    @keyframes leave {
      to {
        opacity: 0;
        transform: translateY(-14px) scale(0.98);
      }
    }
    @keyframes fin {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    /* Typography */
    h1,
    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-weight: 700;
      color: var(--head);
      line-height: 1.16;
      transition: color 0.9s;
    }
    h1 {
      font-size: clamp(26px, 7.5vw, 40px);
    }
    h1 .nm {
      display: block;
      margin-top: 2px;
      font-size: clamp(36px, 11.5vw, 60px);
      font-weight: 800;
      overflow-wrap: anywhere;
      background: linear-gradient(135deg, #c81e55, #f0658f 60%, #d1235c);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding: 0 4px 6px;
    }
    h2 {
      font-size: clamp(24px, 6.8vw, 34px);
    }
    .sub {
      font-size: 14px;
      line-height: 1.45;
      color: var(--soft);
      font-weight: 600;
      transition: color 0.9s, opacity 0.6s;
      padding: 0 6px;
    }
    .q {
      font-size: clamp(16px, 4.5vw, 19px);
      font-weight: 600;
      color: #5c3a47;
      line-height: 1.4;
    }
    .hand {
      font-family: 'Caveat', cursive;
    }
    .pill {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid #f0cdd8;
      color: #9e6b7a;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 999px;
    }

    /* Tactile Buttons */
    .btn {
      position: relative;
      overflow: hidden;
      font: 700 15px 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(135deg, #de2b65, #c81e55);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 13px 32px;
      min-height: 46px;
      cursor: pointer;
      box-shadow: 0 10px 24px -6px rgba(209, 35, 92, 0.5);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s, opacity 0.6s;
    }
    .btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -60%;
      width: 36%;
      height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.5), transparent);
      transform: skewX(-20deg);
      animation: shine 3.4s infinite;
    }
    @keyframes shine {
      0%,
      60% {
        left: -60%;
      }
      100% {
        left: 130%;
      }
    }
    .btn:hover {
      transform: translateY(-2px) scale(1.03);
    }
    .btn:active {
      transform: scale(0.95);
    }
    .btn.ghost {
      background: #fff;
      color: var(--rose);
      border: 2px solid #f0b4c6;
      box-shadow: 0 6px 16px -8px rgba(209, 35, 92, 0.35);
    }
    .btn.ghost::after {
      display: none;
    }
    .btn.sm {
      padding: 11px 20px;
      min-height: 42px;
      font-size: 14px;
    }
    .slot {
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .reveal {
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.6s, transform 0.6s;
    }
    .reveal.on {
      opacity: 1;
      pointer-events: auto;
      transform: none;
    }

    /* Stage 1: Welcome (Crown & Celebration Arch) */
    .bunting {
      width: min(350px, 90vw);
      height: auto;
      display: block;
    }
    .scene {
      width: min(260px, 68vw, calc(var(--u) * 26));
      height: auto;
      display: block;
      overflow: visible;
    }
    .rowbox {
      position: relative;
      width: 100%;
      height: 116px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #no {
      transition: transform 0.28s cubic-bezier(0.34, 1.4, 0.64, 1);
      white-space: nowrap;
    }
    .tw {
      animation: tw 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes tw {
      50% {
        opacity: 0.35;
        transform: scale(0.7);
      }
    }

    /* Stage 2: Balloons */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, auto);
      gap: 12px 24px;
      justify-content: center;
    }
    .bal {
      --bh: min(148px, calc(var(--u) * 20));
      width: calc(var(--bh) * 0.8);
      height: var(--bh);
      position: relative;
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .bal svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: bob 3.4s ease-in-out infinite;
      filter: drop-shadow(0 8px 10px rgba(120, 40, 70, 0.18));
    }
    .bal:nth-child(2) svg {
      animation-delay: -0.8s;
    }
    .bal:nth-child(3) svg {
      animation-delay: -1.6s;
    }
    .bal:nth-child(4) svg {
      animation-delay: -2.4s;
    }
    @keyframes bob {
      50% {
        transform: translateY(-9px) rotate(2deg);
      }
    }
    .bal .word {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      color: var(--head);
      line-height: 1;
      text-align: center;
      overflow-wrap: anywhere;
      padding: 0 4px;
      opacity: 0;
      transform: scale(0.4);
      transition: opacity 0.5s 0.12s, transform 0.6s 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .bal.popped svg {
      animation: pop 0.3s forwards;
    }
    .bal.popped .word {
      opacity: 1;
      transform: scale(1);
    }
    @keyframes pop {
      40% {
        transform: scale(1.18);
      }
      100% {
        transform: scale(1.5);
        opacity: 0;
        visibility: hidden;
      }
    }
    .spark {
      position: absolute;
      left: 50%;
      top: 42%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      pointer-events: none;
      animation: spk 0.7s forwards;
    }
    @keyframes spk {
      to {
        transform: translate(var(--x), var(--y)) scale(0);
        opacity: 0;
      }
    }

    /* Stage 3: Candle */
    .cake {
      width: min(265px, 74vw, calc(var(--u) * 36));
      height: auto;
      display: block;
      cursor: pointer;
      transition: filter 1.4s;
      overflow: visible;
    }
    #stage.twilight .cake {
      filter: brightness(0.78) saturate(0.9);
    }
    .hdslot {
      display: grid;
      width: 100%;
      min-height: 74px;
      font-size: clamp(24px, 6.8vw, 34px);
    }
    .hdslot > * {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.85s ease;
    }
    .wishtxt {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(32px, 9.5vw, 46px);
      line-height: 1.08;
      color: #fff3cc;
      text-shadow: 0 2px 14px rgba(255, 198, 107, 0.95), 0 0 34px rgba(255, 158, 184, 0.85);
      opacity: 0;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    #stage.twilight .wishtxt {
      opacity: 1;
    }
    #stage.twilight .hdslot h2 {
      opacity: 0;
    }
    #stage.twilight .sub.hint {
      opacity: 0;
    }
    .flame {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: flick 0.22s ease-in-out infinite alternate;
    }
    @keyframes flick {
      from {
        transform: scale(1, 1) rotate(-3deg);
      }
      to {
        transform: scale(0.9, 1.12) rotate(3deg);
      }
    }
    .halo {
      animation: halo 1.6s ease-in-out infinite alternate;
    }
    @keyframes halo {
      from {
        opacity: 0.5;
      }
      to {
        opacity: 0.85;
      }
    }
    .smoke {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .out .flame,
    .out .halo {
      display: none;
    }
    .out .smoke {
      animation: smk 2.8s ease-out forwards;
    }
    .out .smoke:nth-of-type(2) {
      animation-delay: 0.35s;
    }
    .out .smoke:nth-of-type(3) {
      animation-delay: 0.7s;
    }
    @keyframes smk {
      0% {
        opacity: 0.75;
        transform: translateY(0) scale(0.5);
      }
      100% {
        opacity: 0;
        transform: translateY(-80px) scale(2);
      }
    }

    /* Stage 4: Royal Crown Constellation (Full Connected Crown!) */
    .sky {
      width: min(315px, 86vw, calc(var(--u) * 39 * 1.15));
      aspect-ratio: 300 / 260;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 40px -14px rgba(40, 20, 80, 0.6);
    }
    .sky svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    .sky .st {
      cursor: pointer;
    }
    .sky .st .core {
      transform-box: fill-box;
      transform-origin: center;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sky .st .glow {
      opacity: 0;
      transition: opacity 0.6s;
    }
    .sky .st.lit .glow {
      opacity: 1;
    }
    .sky .st:not(.lit) .core {
      fill: #8582bd;
      transform: scale(0.75);
      animation: tw 2.6s ease-in-out infinite;
    }
    .sky .st.lit .core {
      fill: #ffe08a;
      transform: scale(1.38);
    }
    .sky .line {
      stroke: #ffd9a0;
      stroke-width: 2.2;
      fill: none;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      stroke-linejoin: round;
      stroke-linecap: round;
    }
    .sky.done .line {
      animation: draw 2.2s ease forwards;
    }
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    .sky .hfill {
      fill: #ffd27a;
      opacity: 0;
      transition: opacity 2s 1.4s;
    }
    .sky.done .hfill {
      opacity: 0.25;
    }
    .swap {
      display: grid;
      width: 100%;
      min-height: 42px;
    }
    .swap > * {
      grid-area: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s;
    }
    .swap .b {
      opacity: 0;
    }
    .swap.on .a {
      opacity: 0;
    }
    .swap.on .b {
      opacity: 1;
    }

    /* Stage 5: Interactive Spin-the-Wheel (Vaini's Birthday Fortune!) */
    .wheel-wrap {
      position: relative;
      width: min(260px, 74vw);
      height: min(260px, 74vw);
      display: grid;
      place-items: center;
      margin: 4px 0;
    }
    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid var(--rose);
      filter: drop-shadow(0 3px 6px rgba(184, 37, 85, 0.45));
    }
    .wheel-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 16px 36px -12px rgba(184, 37, 85, 0.48), 0 0 0 5px #fff, 0 0 0 8px var(--gold);
      transition: transform 3.6s cubic-bezier(0.15, 0.85, 0.25, 1);
      cursor: pointer;
    }
    .wheel-res {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #f2b7c6;
      border-radius: 16px;
      padding: 12px 16px;
      width: 100%;
      animation: enter 0.5s both;
      box-shadow: 0 10px 24px -12px rgba(184, 37, 85, 0.35);
    }

    /* Stage 6: Polaroid Moments */
    .stackbox {
      --h: min(295px, calc(var(--u) * 38));
      position: relative;
      height: var(--h);
      width: min(calc(var(--h) * 0.8), 72vw);
      touch-action: none;
      cursor: grab;
      margin: 6px 0;
    }
    .pol {
      position: absolute;
      inset: 0;
      background: #fff;
      border-radius: 6px;
      padding: 10px 10px 0;
      box-shadow: 0 14px 30px -10px rgba(120, 40, 70, 0.45);
      transition: transform 0.45s cubic-bezier(0.3, 0.8, 0.3, 1), opacity 0.4s;
      will-change: transform;
    }
    .pol .ph {
      height: calc(100% - 54px);
      border-radius: 3px;
      overflow: hidden;
      background: #fbe3ea;
    }
    .pol img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }
    .pol .cap {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: 24px;
      color: var(--head);
      padding: 0 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Stage 7: Why You're the Best Vaini */
    .list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }
    .item {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid #f3c8d5;
      color: var(--ink);
      cursor: pointer;
      font: 600 14px/1.4 'Plus Jakarta Sans', sans-serif;
      box-shadow: 0 10px 24px -14px rgba(184, 37, 85, 0.5);
      transition: transform 0.25s, background 0.4s, border-color 0.4s;
    }
    .item:active {
      transform: scale(0.98);
    }
    .item .ic {
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffd1de, #f7a1bc);
      font-size: 16px;
    }
    .item .tx {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .item .on {
      display: none;
    }
    .item.open {
      background: #fff;
      border-color: #e59ab3;
      cursor: default;
    }
    .item.open .off {
      display: none;
    }
    .item.open .on {
      display: block;
      animation: fin 0.6s both;
    }

    /* Stage 8: 3D Flip Vaini VIP Vouchers */
    .promise-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 11px;
      perspective: 1100px;
    }
    .pcard {
      position: relative;
      width: 100%;
      min-height: 76px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.72s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .pcard.flipped {
      transform: rotateX(180deg);
      cursor: default;
    }
    .pface {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 18px;
      padding: 12px 15px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      box-shadow: 0 12px 26px -14px rgba(184, 37, 85, 0.52);
    }
    .pfront {
      background: linear-gradient(135deg, #fff8fa 0%, #fde6ee 100%);
      border: 1.5px solid #e9b465;
    }
    .pback {
      transform: rotateX(180deg);
      background: linear-gradient(135deg, #ffffff 0%, #fff4f7 100%);
      border: 1.5px solid #e291ac;
    }
    .wax {
      flex: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #f05a8c, #b4194c);
      border: 2px solid #f3cf7a;
      color: #fff;
      font-size: 16px;
      display: grid;
      place-items: center;
      box-shadow: 0 4px 10px rgba(180, 25, 76, 0.35);
    }
    .pback .wax {
      background: linear-gradient(135deg, #ffe7a8, #f2be5c);
      color: #8f3250;
      border-color: #fff;
    }
    .ptx {
      flex: 1;
      min-width: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.38;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .pfront .ptx {
      color: var(--head);
    }

    /* Stage 9: Royal Scroll / Newspaper "VAINI TIMES" (Completely different from Envelope!) */
    .scroll-box {
      width: 100%;
      max-width: 365px;
      background: #fffdf8;
      border: 2px solid #e4c686;
      border-radius: 16px;
      box-shadow: 0 18px 40px -14px rgba(120, 40, 70, 0.45);
      overflow: hidden;
      text-align: left;
      animation: enter 0.75s both;
    }
    .news-hdr {
      background: linear-gradient(135deg, #fbe5ec, #f8d4e0);
      border-bottom: 2px double #d4af37;
      padding: 12px 14px 10px;
      text-align: center;
    }
    .news-tag {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: #9c3858;
    }
    .news-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 800;
      font-size: 24px;
      color: var(--head);
      letter-spacing: 0.5px;
      margin: 2px 0;
    }
    .news-meta {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: #7c495a;
      border-top: 1px solid rgba(184, 37, 85, 0.25);
      padding-top: 5px;
      margin-top: 4px;
    }
    .news-body {
      padding: 14px 16px 16px;
      font-family: 'Caveat', cursive;
      font-weight: 600;
      font-size: clamp(20px, 5.4vw, 23px);
      line-height: 29px;
      color: #5c2539;
      white-space: pre-wrap;
      max-height: min(calc(var(--u) * 44), 360px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overflow-wrap: anywhere;
    }
    .news-stamp {
      display: inline-block;
      margin-top: 10px;
      padding: 3px 10px;
      border: 2px solid #c81e55;
      border-radius: 6px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #c81e55;
      transform: rotate(-3deg);
    }

    /* Stage 10: Gift Finale (Clean Trophy & Celebration Finale, No Bear/Rabbit/Secret) */
    .gift {
      width: min(200px, 54vw, calc(var(--u) * 26));
      height: auto;
      display: block;
      cursor: pointer;
      animation: giftShake 2.2s ease-in-out infinite;
      overflow: visible;
      filter: drop-shadow(0 16px 24px rgba(184, 37, 85, 0.28));
    }
    .gift .glid {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.45s;
    }
    .gift.opening {
      animation: none;
    }
    .gift.opening .glid {
      transform: translateY(-34px) rotate(-14deg) scale(1.04);
      opacity: 0;
    }
    @keyframes giftShake {
      0%,
      100% {
        transform: rotate(0);
      }
      15% {
        transform: rotate(-6deg) scale(1.04);
      }
      30% {
        transform: rotate(6deg) scale(1.04);
      }
      45% {
        transform: rotate(-4deg);
      }
      60% {
        transform: rotate(3deg);
      }
      75%,
      90% {
        transform: rotate(0);
      }
    }
    .final {
      width: 100%;
      max-width: 360px;
      padding: 22px 18px 20px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      border: 1.5px solid #f2b7c6;
      box-shadow: 0 20px 44px -16px rgba(184, 37, 85, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      animation: enter 0.9s both;
    }
    .final .big {
      font-family: 'Caveat', cursive;
      font-weight: 700;
      font-size: clamp(32px, 9vw, 40px);
      color: var(--head);
      line-height: 1.1;
    }
    .final .sub {
      max-width: 300px;
    }
    .devar-badge {
      margin-top: 4px;
      padding: 8px 16px;
      border-radius: 999px;
      background: linear-gradient(135deg, #fff5f8, #fde2eb);
      border: 1px solid #f0b4c6;
      font-size: 13px;
      font-weight: 700;
      color: var(--head);
    }

    #conf {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 30;
    }

    /* Chrome Controls */
    #dots {
      position: absolute;
      bottom: calc(16px + env(safe-area-inset-bottom));
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      z-index: 10;
      pointer-events: none;
    }
    #dots i {
      width: 6px;
      height: 6px;
      border-radius: 99px;
      background: rgba(209, 35, 92, 0.25);
      transition: all 0.5s;
    }
    #dots i.on {
      width: 22px;
      background: var(--rose);
    }
    #mute,
    #adminHeart {
      position: absolute;
      top: calc(12px + env(safe-area-inset-top));
      z-index: 20;
      border: 0;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }
    #mute {
      left: 12px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid #eed4dc;
      font-size: 16px;
      opacity: 0.9;
    }
    #adminHeart {
      right: 12px;
      background: transparent;
      opacity: 0.28;
      color: var(--rose);
    }
    #adminHeart:hover {
      opacity: 0.58;
    }

    /* 15-Second Smart Skip Pill */
    #skipBtn {
      position: absolute;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom));
      z-index: 22;
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid #edc2cf;
      color: var(--head);
      font-size: 12px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 16px -6px rgba(184, 37, 85, 0.35);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.45s ease, transform 0.45s ease, background 0.2s;
    }
    #skipBtn.on {
      opacity: 0.94;
      transform: translateY(0);
      pointer-events: auto;
    }
    #skipBtn:hover {
      opacity: 1;
      background: #fff;
    }

    /* Admin Modal */
    #modal {
      position: absolute;
      inset: 0;
      z-index: 100;
      background: rgba(60, 20, 40, 0.55);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
      user-select: text;
      -webkit-user-select: text;
    }
    #modal.on {
      display: flex;
    }
    .mbox {
      background: #fff8f9;
      border-radius: 20px;
      width: min(560px, 100%);
      max-height: 90dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.5);
    }
    .mhead {
      padding: 15px 18px;
      border-bottom: 1px solid #f0cfd9;
      font: italic 700 23px 'Playfair Display', serif;
      color: var(--head);
    }
    .mbody {
      padding: 6px 18px 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .mbody label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin: 14px 0 5px;
      color: #7a4a5a;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }
    .mbody input[type='text'],
    .mbody textarea {
      width: 100%;
      border: 1.5px solid #efc4d1;
      border-radius: 10px;
      padding: 10px 12px;
      font: 500 16px 'Plus Jakarta Sans', sans-serif;
      background: #fff;
      color: #4a2030;
    }
    .mbody textarea {
      min-height: 140px;
      resize: vertical;
      line-height: 1.5;
    }
    .mbody input:focus,
    .mbody textarea:focus {
      outline: none;
      border-color: var(--rose);
    }
    .g2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .g1 {
      display: grid;
      gap: 8px;
    }
    .pitem {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
      background: #fff;
      border: 1.5px solid #f6d0da;
      border-radius: 12px;
      padding: 6px;
    }
    .pitem img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 8px;
      flex: none;
    }
    .pitem input {
      flex: 1;
      min-width: 0;
    }
    .pitem button {
      border: 0;
      background: #fde1e8;
      color: var(--head);
      border-radius: 8px;
      width: 32px;
      height: 34px;
      cursor: pointer;
      font-weight: 700;
      flex: none;
    }
    .mfoot {
      padding: 12px 18px;
      border-top: 1px solid #f0cfd9;
      background: #fdf3f5;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .mfoot .btn {
      padding: 10px 15px;
      font-size: 13px;
      min-height: 38px;
    }
    .mfoot .btn::after {
      display: none;
    }
    #a_msg {
      font-size: 12px;
      color: var(--soft);
      padding: 0 18px 8px;
      min-height: 20px;
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';
      var KEY = 'neha_vaini_unique_v2';
      var $ = function (s, p) {
        return (p || document).querySelector(s);
      };
      var esc = function (s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      };

      /* ---------- DEFAULT CONFIG (UNIQUE VAINI EDITION) ---------- */
      function ph(title, a, b, emoji) {
        var svg =
          '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="440" viewBox="0 0 400 440">' +
          '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
          '<stop offset="0" stop-color="' + a + '"/>' +
          '<stop offset="1" stop-color="' + b + '"/>' +
          '</linearGradient></defs>' +
          '<rect width="400" height="440" fill="url(#g)"/>' +
          '<circle cx="200" cy="185" r="85" fill="#fff" opacity=".45"/>' +
          '<text x="200" y="215" font-size="84" text-anchor="middle">' + emoji + '</text>' +
          '<text x="200" y="320" font-family="Georgia,serif" font-style="italic" font-size="24" fill="#5c3e47" text-anchor="middle">' + title + '</text>' +
          '</svg>';
        return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
      }

      var DEFAULT = {
        name: 'Neha Vaini',
        welcomeSubtitle: "Ready for your special Devar-approved birthday surprise?",
        balloonWords: ['Best', 'Vaini', 'In', 'The World'],
        reasons: [
          "You handle Dada's mood swings like an absolute boss 😂",
          'You bring so much warmth, energy, and laughter into our home ✨',
          'You are way more like an older sister than a sister-in-law 🌸',
          'You always have my back whenever I need backup at home 🙌',
          'Honestly, Dada definitely married way out of his league 😎'
        ],
        promises: [
          '1x Automatic backup in any argument with Dada 🤝',
          '1x Coffee or dessert treat, courtesy of your favorite Devar ☕',
          '1x Small favor granted with zero complaints (valid anytime) 🎟️'
        ],
        letterBody:
          "BREAKING NEWS: Today is officially the birthday of the coolest Vaini in the family! 🎂\n\nThank you for bringing so much happiness, patience, and good vibes into our home every single day. Having you around makes everything brighter.\n\nAlso, huge respect for putting up with Dada on a daily basis—you honestly deserve a national award for that alone!\n\nOn your special day, I wish you endless joy, good health, and success in everything you do. Remember, no matter what happens, your Devar is always in your corner.\n\nHave an awesome birthday celebration today! 🥂✨\n\n— Reported live by Your Favorite Devar 🙌",
        photos: [
          { src: ph('Best Vaini', '#ffdde6', '#f8b4c8', '👑'), caption: 'Happy Birthday Vaini! 🎂' },
          { src: ph('Family MVP', '#ffe8d6', '#f9c6c9', '🏆'), caption: 'The real boss of the house 🎉' },
          { src: ph('Make a Wish', '#e8dff5', '#fce1e4', '🎈'), caption: 'Wishing you the best year ahead 🎈' },
          { src: ph('Team Vaini', '#fce1e4', '#fad2e1', '🙌'), caption: 'Always on your team! ✨' },
          { src: ph('Stay Awesome', '#fff1e6', '#fad2e1', '🌟'), caption: 'Cheers to our favorite Vaini 🥂' }
        ],
        _t: 0
      };

      var CFG;
      function norm(c) {
        var o = JSON.parse(JSON.stringify(DEFAULT));
        if (c) {
          if (c.name) o.name = String(c.name);
          if (c.welcomeSubtitle) o.welcomeSubtitle = String(c.welcomeSubtitle);
          if (Array.isArray(c.balloonWords)) {
            for (var i = 0; i < 4; i++) if (c.balloonWords[i]) o.balloonWords[i] = String(c.balloonWords[i]);
          }
          if (Array.isArray(c.reasons)) {
            for (var j = 0; j < 5; j++) if (c.reasons[j]) o.reasons[j] = String(c.reasons[j]);
          }
          var promSrc = Array.isArray(c.promises) ? c.promises : c.coupons;
          if (Array.isArray(promSrc)) {
            for (var k = 0; k < 3; k++) if (promSrc[k]) o.promises[k] = String(promSrc[k]);
          }
          if (c.letterBody) o.letterBody = String(c.letterBody);
          if (Array.isArray(c.photos) && c.photos.length) {
            o.photos = c.photos.slice(0, 10).map(function (p) {
              return { src: p.src, caption: p.caption || '' };
            });
          }
          o._t = c._t || 0;
        }
        return o;
      }

      function loadCfg() {
        var l = null;
        try {
          var s = localStorage.getItem(KEY);
          if (s) l = JSON.parse(s);
        } catch (e) {}
        var b = window.BAKED,
          c;
        if (l && b) c = (l._t || 0) > (b._t || 0) ? l : b;
        else c = l || b;
        CFG = norm(c);
      }
      loadCfg();

      /* ---------- SHELL ---------- */
      var root = $('#root');
      root.innerHTML =
        '<div id="orbs"><i></i><i></i><i></i></div>' +
        '<div id="hearts"></div>' +
        '<div id="dim"></div>' +
        '<div id="stage"></div>' +
        '<canvas id="conf"></canvas>' +
        '<div id="dots"></div>' +
        '<button id="mute" title="Sound" aria-label="Toggle sound">🔊</button>' +
        '<button id="adminHeart" aria-label="Customize"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l7.1-1.01L12 2z"/></svg></button>' +
        '<button id="skipBtn" aria-label="Skip stage">Skip →</button>' +
        '<div id="modal"></div>';

      var stage = $('#stage'),
        dim = $('#dim'),
        dots = $('#dots'),
        skipBtn = $('#skipBtn');
      var TOTAL = 10;
      for (var di = 0; di < TOTAL; di++) dots.appendChild(document.createElement('i'));

      /* ---------- SOFT LOW-VOLUME MUSIC-BOX ENGINE ---------- */
      var AC,
        master,
        bus,
        muted = false;
      function ac() {
        try {
          if (!AC) {
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return null;
            AC = new C();
            master = AC.createGain();
            master.gain.value = 0.14;
            master.connect(AC.destination);
            bus = AC.createGain();
            bus.connect(master);
            var d = AC.createDelay(1);
            d.delayTime.value = 0.26;
            var fb = AC.createGain();
            fb.gain.value = 0.26;
            var wet = AC.createGain();
            wet.gain.value = 0.26;
            bus.connect(d);
            d.connect(fb);
            fb.connect(d);
            d.connect(wet);
            wet.connect(master);
          }
          if (AC.state === 'suspended') AC.resume();
          return AC;
        } catch (e) {
          return null;
        }
      }

      function note(f, t0, d, v, oct) {
        if (muted) return;
        try {
          var c = ac();
          if (!c) return;
          t0 = t0 || 0;
          d = d || 0.7;
          v = v == null ? 0.5 : v;
          oct = oct == null ? 0.15 : oct;
          var t = c.currentTime + t0,
            g = c.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.linearRampToValueAtTime(v, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + d);
          g.connect(bus);
          var o = c.createOscillator();
          o.type = 'sine';
          o.frequency.value = f;
          o.connect(g);
          o.start(t);
          o.stop(t + d + 0.05);
          if (oct) {
            var o2 = c.createOscillator(),
              g2 = c.createGain();
            o2.type = 'triangle';
            o2.frequency.value = f * 2;
            g2.gain.value = oct;
            o2.connect(g2);
            g2.connect(g);
            o2.start(t);
            o2.stop(t + d + 0.05);
          }
        } catch (e) {}
      }

      function noise(t0, d, f0, f1, v, type) {
        if (muted) return;
        try {
          var c = ac();
          if (!c) return;
          var n = Math.floor(c.sampleRate * d),
            b = c.createBuffer(1, n, c.sampleRate),
            a = b.getChannelData(0);
          for (var i = 0; i < n; i++) a[i] = (Math.random() * 2 - 1) * Math.sin((i / n) * Math.PI);
          var s = c.createBufferSource();
          s.buffer = b;
          var f = c.createBiquadFilter();
          f.type = type || 'lowpass';
          var t = c.currentTime + t0;
          f.frequency.setValueAtTime(f0, t);
          f.frequency.exponentialRampToValueAtTime(f1, t + d);
          var g = c.createGain();
          g.gain.value = v;
          s.connect(f);
          f.connect(g);
          g.connect(master);
          s.start(t);
        } catch (e) {}
      }

      var STAR = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568];
      var S = {
        tap: function () {
          note(587.33, 0, 0.25, 0.5);
        },
        pop: function (i) {
          if (muted) return;
          try {
            var c = ac();
            if (!c) return;
            var t = c.currentTime,
              o = c.createOscillator(),
              g = c.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(340, t);
            o.frequency.exponentialRampToValueAtTime(140, t + 0.08);
            g.gain.setValueAtTime(0.55, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
            o.connect(g);
            g.connect(master);
            o.start(t);
            o.stop(t + 0.1);
            var h = [1046.5, 1318.51, 1567.98, 1975.53];
            note(h[i % 4], 0.03, 0.9, 0.55);
          } catch (e) {}
        },
        blow: function () {
          noise(0, 0.8, 520, 160, 0.9);
          [349.23, 440, 523.25, 659.25].forEach(function (f, i) {
            note(f, 0.28 + i * 0.08, 1.5, 0.4);
          });
        },
        swipe: function () {
          noise(0, 0.14, 900, 900, 0.35, 'bandpass');
          note(659.25, 0.02, 0.3, 0.35);
        },
        env: function () {
          [523.25, 659.25, 783.99].forEach(function (f, i) {
            note(f, i * 0.1, 0.8, 0.5);
          });
        },
        tick: function () {
          note(880, 0, 0.07, 0.14, 0);
        },
        star: function (i) {
          note(STAR[i % 9], 0, 1.1, 0.5);
          note(STAR[i % 9] * 2, 0.05, 0.6, 0.12, 0);
        },
        reveal: function () {
          note(783.99, 0, 0.5, 0.45);
          note(1174.66, 0.08, 0.7, 0.3);
        },
        fin: function () {
          [523.25, 659.25, 783.99, 987.77, 1174.66, 1046.5].forEach(function (f, i) {
            note(f, i * 0.11, 1.2, 0.6);
          });
        },
        chord: function () {
          [523.25, 659.25, 783.99, 1046.5].forEach(function (f, i) {
            note(f, i * 0.07, 1.8, 0.45);
          });
        }
      };

      $('#mute').onclick = function () {
        muted = !muted;
        this.textContent = muted ? '🔇' : '🔊';
        if (!muted) {
          ac();
          S.tap();
        }
      };

      /* ---------- AMBIENT SPARKLES & STARS ---------- */
      var hcols = ['#f4a6bb', '#f7b6c6', '#ffc8d6', '#e98aa6', '#ffd9a8'];
      setInterval(function () {
        if (document.hidden) return;
        var h = document.createElement('span');
        h.className = 'fh';
        h.textContent = Math.random() < 0.5 ? '✦' : '★';

      /* ---------- CONFETTI ---------- */
      function confetti() {
        var cv = $('#conf'),
          x = cv.getContext('2d'),
          dpr = window.devicePixelRatio || 1,
          W = cv.clientWidth,
          H = cv.clientHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        x.setTransform(dpr, 0, 0, dpr, 0, 0);
        var cols = ['#f06292', '#ffd27a', '#9ed9e8', '#c3a6f0', '#a8e3c1', '#d1235c', '#fff', '#ffb199'],
          ps = [];
        function burst(ox, oy, n, sp) {
          for (var i = 0; i < n; i++) {
            var a = Math.random() * Math.PI * 2,
              s = (0.35 + Math.random() * 0.65) * sp;
            ps.push({
              x: ox,
              y: oy,
              vx: Math.cos(a) * s,
              vy: Math.sin(a) * s - 6,
              c: cols[i % cols.length],
              w: 6 + Math.random() * 7,
              h: 4 + Math.random() * 6,
              r: Math.random() * 6,
              vr: Math.random() * 0.4 - 0.2,
              star: Math.random() < 0.25
            });
          }
        }
        burst(W / 2, H * 0.5, 150, 14);
        setTimeout(function () {
          burst(W * 0.15, H * 0.9, 50, 15);
          burst(W * 0.85, H * 0.9, 50, 15);
        }, 350);

        var f = 0;
        (function d() {
          x.clearRect(0, 0, W, H);
          ps.forEach(function (p) {
            p.vy += 0.26;
            p.vx *= 0.992;
            p.vy *= 0.995;
            p.x += p.vx;
            p.y += p.vy;
            p.r += p.vr;
            x.save();
            x.translate(p.x, p.y);
            x.rotate(p.r);
            x.fillStyle = p.c;
            if (p.star) {
              x.font = '16px serif';
              x.fillText('✦', -6, 6);
            } else {
              x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            }
            x.restore();
          });
          if (++f < 300) requestAnimationFrame(d);
          else x.clearRect(0, 0, W, H);
        })();
      }

        var html = '<!DOCTYPE html>\n' + el.outerHTML;
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 800);
        var m = $('#a_msg');
        if (m) m.textContent = 'Downloaded index.html with all your edits and photos baked in.';
      }

      go(0);
    })();
  </script>

</body></html>
